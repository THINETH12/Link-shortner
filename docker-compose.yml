services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data               # persist DB data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # auto-run on first start
    networks:
      - app-net

  blue:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/shortener
      PORT: 3000
      APP_VERSION: "1.0.0"
    networks:
      - app-net
    depends_on:
      - postgres

  green:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/shortener
      PORT: 3000
      APP_VERSION: "2.0.0"
    networks:
      - app-net
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"             # only Nginx is exposed to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net
    depends_on:
      - blue
      - green

volumes:
  pgdata:

networks:
  app-net: