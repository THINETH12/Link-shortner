<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shrink — Link Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    #1e1e2e;
      --accent:    #7c6aff;
      --accent2:   #3ecfcf;
      --text:      #e8e8f0;
      --muted:     #6b6b80;
      --danger:    #ff5f7e;
      --success:   #3ecfcf;
      --card-bg:   #13131c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 0 48px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Input section ── */
    .shorten-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .shorten-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .shorten-box h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 20px;
      text-transform: none;
      letter-spacing: 0;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .url-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input::placeholder { color: var(--muted); }

    .url-input:focus {
      border-color: var(--accent);
    }

    .shorten-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }

    .shorten-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .shorten-btn:active { transform: translateY(0); }

    /* ── Result banner ── */
    .result-banner {
      display: none;
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-banner.visible { display: flex; }

    .result-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent2);
      text-decoration: none;
    }

    .result-link:hover { text-decoration: underline; }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s, transform 0.4s;
    }

    .stat-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
    }

    .stat-value.accent { color: var(--accent); }
    .stat-value.accent2 { color: var(--accent2); }

    /* ── Chart ── */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 32px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .chart-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 120px;
    }

    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--accent), #4a3acc);
      transition: height 0.6s cubic-bezier(0.34,1.56,0.64,1);
      min-height: 3px;
      position: relative;
      cursor: pointer;
    }

    .bar:hover { opacity: 0.8; }

    .bar-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
    }

    .bar-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--accent2);
    }

    /* ── Links table ── */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .table-title {
      font-size: 14px;
      font-weight: 500;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    td {
      padding: 14px 24px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(124,106,255,0.04); }

    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      background: rgba(124,106,255,0.1);
      padding: 3px 10px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
    }

    .code-badge:hover { background: rgba(124,106,255,0.2); }

    .original-url {
      color: var(--muted);
      font-size: 12px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      text-decoration: none;
    }

    .original-url:hover { color: var(--text); }

    .clicks-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent2);
      font-weight: 500;
    }

    .date-text {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-state .icon {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
      opacity: 0.4;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .input-row { flex-direction: column; }
      td:nth-child(3), th:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">shr<span>.</span>ink</div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="slotLabel">loading...</span>
    </div>
  </header>

  <!-- Shorten box -->
  <div class="shorten-box">
    <h2>Paste a long URL to shorten it</h2>
    <div class="input-row">
      <input class="url-input" type="text" id="urlInput" placeholder="https://example.com/very/long/url/that/nobody-wants-to-type" />
      <button class="shorten-btn" onclick="shorten()">Shorten</button>
    </div>
    <div class="result-banner" id="resultBanner">
      <a class="result-link" id="resultLink" href="#" target="_blank"></a>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card" id="statTotal">
      <div class="stat-label">Total links</div>
      <div class="stat-value accent" id="totalLinks">—</div>
    </div>
    <div class="stat-card" id="statClicks">
      <div class="stat-label">Total clicks</div>
      <div class="stat-value accent2" id="totalClicks">—</div>
    </div>
    <div class="stat-card" id="statTop">
      <div class="stat-label">Most clicked</div>
      <div class="stat-value" id="topLink" style="font-size:18px">—</div>
    </div>
  </div>

  <!-- Bar chart -->
  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Click distribution</div>
        <div class="chart-sub">clicks per short link</div>
      </div>
    </div>
    <div class="bar-chart" id="barChart">
      <div class="empty-state" style="width:100%">
        <span class="icon">📊</span>
        Shorten some links to see stats
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <div class="table-title">All links</div>
      <button class="refresh-btn" onclick="loadLinks()">Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Short code</th>
          <th>Original URL</th>
          <th>Clicks</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="linksTable">
        <tr><td colspan="4">
          <div class="empty-state">
            <span class="icon">🔗</span>
            No links yet — shorten your first URL above
          </div>
        </td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  let currentShortUrl = '';

  // ── Animate stat cards on load
  window.addEventListener('load', () => {
    ['statTotal','statClicks','statTop'].forEach((id, i) => {
      setTimeout(() => document.getElementById(id).classList.add('visible'), i * 120);
    });
    loadLinks();
    loadHealth();
  });

  // ── Health / slot label
  async function loadHealth() {
    try {
      const r = await fetch('/health');
      const d = await r.json();
      document.getElementById('slotLabel').textContent = `v${d.version} · online`;
    } catch {
      document.getElementById('slotLabel').textContent = 'offline';
    }
  }

  // ── Shorten
  async function shorten() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;

    const btn = document.querySelector('.shorten-btn');
    btn.textContent = 'Shortening…';
    btn.disabled = true;

    try {
      const res = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();

      currentShortUrl = data.short;
      const banner = document.getElementById('resultBanner');
      const link = document.getElementById('resultLink');
      link.href = data.short;
      link.textContent = data.short;
      banner.classList.add('visible');

      document.getElementById('copyBtn').textContent = 'Copy';
      document.getElementById('copyBtn').classList.remove('copied');
      document.getElementById('urlInput').value = '';

      loadLinks();
    } catch (e) {
      alert('Something went wrong. Is the server running?');
    } finally {
      btn.textContent = 'Shorten';
      btn.disabled = false;
    }
  }

  // ── Copy
  function copyLink() {
    navigator.clipboard.writeText(currentShortUrl).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // ── Enter key
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') shorten();
  });

  // ── Load links + update stats + chart
  async function loadLinks() {
    try {
      const res = await fetch('/api/links');
      const links = await res.json();

      // Stats
      const totalClicks = links.reduce((s, l) => s + l.clicks, 0);
      const top = links.reduce((a, b) => (b.clicks > (a?.clicks||0) ? b : a), null);

      animateNumber('totalLinks', links.length);
      animateNumber('totalClicks', totalClicks);
      document.getElementById('topLink').textContent = top ? `/${top.code} · ${top.clicks}` : '—';

      // Table
      const tbody = document.getElementById('linksTable');
      if (links.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">
          <div class="empty-state">
            <span class="icon">🔗</span>
            No links yet — shorten your first URL above
          </div>
        </td></tr>`;
      } else {
        tbody.innerHTML = links.map(l => `
          <tr>
            <td><a class="code-badge" href="/${l.code}" target="_blank">/${l.code}</a></td>
            <td><a class="original-url" href="${l.original}" target="_blank" title="${l.original}">${l.original}</a></td>
            <td><span class="clicks-badge">${l.clicks}</span></td>
            <td><span class="date-text">${new Date(l.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</span></td>
          </tr>
        `).join('');
      }

      // Bar chart
      renderChart(links);

    } catch (e) {
      console.error('Failed to load links', e);
    }
  }

  // ── Animated counter
  function animateNumber(id, target) {
    const el = document.getElementById(id);
    const start = parseInt(el.textContent) || 0;
    const duration = 600;
    const startTime = performance.now();
    function step(now) {
      const p = Math.min((now - startTime) / duration, 1);
      el.textContent = Math.round(start + (target - start) * p);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ── Bar chart
  function renderChart(links) {
    const chart = document.getElementById('barChart');
    if (links.length === 0) {
      chart.innerHTML = `<div class="empty-state" style="width:100%">
        <span class="icon">📊</span>Shorten some links to see stats</div>`;
      return;
    }

    const maxClicks = Math.max(...links.map(l => l.clicks), 1);
    const show = links.slice(0, 12);

    chart.innerHTML = show.map(l => {
      const pct = Math.max((l.clicks / maxClicks) * 100, 3);
      return `
        <div class="bar-wrap">
          <div class="bar-val">${l.clicks}</div>
          <div class="bar" style="height:0" data-h="${pct}%" title="/${l.code}: ${l.clicks} clicks"></div>
          <div class="bar-label">/${l.code}</div>
        </div>`;
    }).join('');

    // Animate bars in
    requestAnimationFrame(() => {
      chart.querySelectorAll('.bar').forEach((bar, i) => {
        setTimeout(() => { bar.style.height = bar.dataset.h; }, i * 60);
      });
    });
  }
</script>
</body>
</html>
